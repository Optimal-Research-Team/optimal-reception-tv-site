<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Optimal Reception TV</title>
  <link rel="icon" href="media/favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--night-950, #0B1608); color: #C9CDBF; font: 400 15px/1.5 "Public Sans", system-ui, sans-serif; letter-spacing: -0.02em; }
    .wrap { max-width: 1680px; margin: 0 auto; padding: 22px clamp(16px, 3vw, 36px) 40px; }
    header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
    header optimal-logo { width: 130px; }
    header h1 { margin: 0; font: 400 30px/1 Castoro, Georgia, serif; letter-spacing: -0.04em; color: #FFFCF7; }
    header h1 em { color: #A9D49C; }
    header p { margin: 0 0 0 auto; color: #8E9884; font-size: 13px; max-width: 640px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 18px; align-items: start; }
    .tv { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255, 252, 247, .08), 0 30px 60px -24px rgba(0, 0, 0, .8); }
    .tv iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .remote { height: min(86vh, 980px); border-radius: 18px; overflow: hidden; background: #FFFCF7; box-shadow: 0 0 0 1px rgba(255, 252, 247, .08); }
    .remote iframe { width: 100%; height: 100%; border: 0; display: block; }
    .links { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 14px; font-size: 13px; }
    .links a { color: #A9D49C; }
    @media (max-width: 1100px) { .grid { grid-template-columns: minmax(0, 1fr); } .remote { height: 900px; } }
  </style>
  <script type="module" crossorigin src="./assets/preview-Dd9j86re.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/optimal-logo-BEcy5AzM.js">
  <link rel="stylesheet" crossorigin href="./assets/optimal-logo-CWjZz7vM.css">
  <link rel="stylesheet" crossorigin href="./assets/forest-night-_DHs87TC.css">
</head>
<body>
  <div class="wrap">
    <header>
      <optimal-logo variant="inline" theme="dark" play="load"></optimal-logo>
      <h1>Reception <em>TV</em></h1>
      <p>Preview. The TV here plays every item at any hour (the real TV keeps to clinic hours), and the remote on the right drives it like the one at the front desk. Nothing here touches the real TV.</p>
    </header>
    <div class="grid">
      <div>
        <div class="tv"><iframe id="tv" src="tv.html?review&noserver&preview" title="Reception TV" allow="autoplay; fullscreen"></iframe></div>
        <div class="links"><a href="tv.html?review&preview" target="_blank" rel="noopener">Open the TV full screen</a><a href="remote.html?preview" target="_blank" rel="noopener">Open the remote on its own</a></div>
      </div>
      <div class="remote"><iframe id="remote" src="remote.html?noserver&preview" title="Remote"></iframe></div>
    </div>
  </div>
</body>
</html>
